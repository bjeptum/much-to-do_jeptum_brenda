version: "3.8"

services:
  mongo:
    image: mongo:6.0
    container_name: mongo-db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: lakwet123
      MONGO_INITDB_DATABASE: muchtodo
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muchtodo-backend
    restart: always
    environment:
      MONGO_URI: "mongodb://root:lakwet123@mongo:27017/muchtodo?authSource=admin"
      DB_NAME: muchtodo
      PORT: 8080
      JWT_SECRET_KEY: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRATION_HOURS: 72
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
