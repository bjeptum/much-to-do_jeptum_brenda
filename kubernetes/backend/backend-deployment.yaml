apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: muchtodo-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-configmap
                  key: mongo-host
            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-configmap
                  key: mongo-port
            - name: MONGO_USER
              valueFrom:
                configMapKeyRef:
                  name: backend-configmap
                  key: mongo-username
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: mongo-password
            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: backend-configmap
                  key: mongo-database
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-configmap
                  key: port
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10